<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>PSFK - Future Of Home Living</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1" />
	
	<!-- Google Fonts -->	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

	<script type="module" src="/main.js"></script>
</head>

<body>

	<nav class="header">
		<div class="left">
			<a href="#" class="toggle_circles"><img src="/img/icon_grid.svg" alt="Grid Menu"></a>
			<a href="#" class="toggle_list"><img src="/img/icon_hamburger.svg" alt="List Menu"></a>
		</div>
		<div class="right">
			<a href="#home">
				<img class="logo" src="/img/logo.png" alt="Future Of Home Living" />
			</a>
		</div>
	</nav>

	<main>

		<!-- Circle View -->
		<div class="circles_wrapper">
			<div id="circle-nav">
				<div class="category-links">
					<a href="#adaptive">Adaptive</a>
					<a href="#on-demand">On-Demand</a>
					<a href="#equilibrium">Equilibrum</a>
				</div>
			</div>

			<section id="circles">
				<!-- circle from data.json -->
			</section>
		</div>

		<!-- List View -->
		<section id="list-view" class="hidden">
			<!-- list from data.json -->
        </section>

		<!-- Sliding Panel -->
		<div id="panel-overlay">
	
			<div id="sliding-panel">
				<div id="top">
					<button id="close-panel-btn" aria-label="Close Panel">&times;</button>
				</div>

				<section id="product">

					<div class="product-content">
					
						<header>
							<div class="product-illustration">
								<img src="https://placeholdit.com/600x400/dddddd/999999" alt="Item Name" />
							</div>
							<h1>
								<!-- Item Title -->
							</h1>
							<ul>
								<li>
									<a href="#">
										<span class="company">
											<!-- Item Company -->
										</span>
									</a>
								</li>
								<li>/</li>
								<li>
									<a href="#">
										<span class="social">
											<!-- Item Social -->
										</span>
									</a>
								</li>
							</ul>
						</header>

						<div class="content">
							<!-- Item Content -->
							<p class="description-text"></p>
							<div class="product-photo">
								<img src="https://placeholdit.com/600x400/dddddd/999999" alt="Item Name" />
							</div>
						</div>
					</div>
				</section>
			</div>

	</main>
</body>
</html>
